<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pavlet  Precision Audio. Beautifully Simple.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#13151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecaa46"/>
      <stop offset="1" stop-color="#3d7bf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3d7bf0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d7bf0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- logo mark -->
  <g transform="translate(120,235)">
    <rect width="160" height="160" rx="38" fill="#070a12" stroke="#23262f" stroke-width="2"/>
    <g fill="url(#accent)" transform="translate(34,40)">
      <rect x="0" y="40" width="14" height="50" rx="7"/>
      <rect x="26" y="10" width="14" height="80" rx="7"/>
      <rect x="52" y="26" width="14" height="64" rx="7"/>
      <rect x="78" y="0" width="14" height="90" rx="7"/>
    </g>
  </g>
  <!-- text -->
  <g transform="translate(330,255)" font-family="-apple-system, Segoe UI, Roboto, Inter, sans-serif">
    <text x="0" y="0" font-size="92" font-weight="700" fill="#f5f6f8">Pavlet</text>
    <text x="2" y="64" font-size="40" font-weight="500" fill="#aeb4c0">Precision Audio. Beautifully Simple.</text>
    <text x="2" y="120" font-size="26" font-weight="400" fill="#3d7bf0">An advanced music player for iPhone</text>
  </g>
</svg>
